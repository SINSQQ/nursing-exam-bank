<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nursing Exam Quiz</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fb;color:#20232a}.wrap{max-width:860px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid #d9deea;border-radius:8px;padding:16px}.home{text-align:center;padding:34px 16px}.home h1{margin:0 0 8px;color:#244c85;font-size:26px}.muted{color:#5f6876;font-size:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.title{font-weight:700;color:#244c85}.bar{height:7px;background:#e7ebf1;border-radius:999px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#147a5c}.q{font-size:18px;line-height:1.5;margin:12px 0}.opts{display:grid;gap:8px}.opt{border:1px solid #cbd3df;border-radius:8px;background:#fff;padding:12px;text-align:right;cursor:pointer;line-height:1.45;font:inherit}.opt:hover{background:#f4f7fb;border-color:#244c85}.opt.correct{background:#e9f6f1;border-color:#147a5c;color:#0b5b43}.opt.wrong{background:#fff0f0;border-color:#b32d2e;color:#8a2020}.btn{border:1px solid #cbd3df;border-radius:6px;background:#fff;padding:10px 14px;cursor:pointer;font:inherit;text-decoration:none;color:#20232a;display:inline-block;margin:4px}.btn.primary{background:#244c85;border-color:#244c85;color:#fff}.btn.green{background:#147a5c;border-color:#147a5c;color:#fff}.btn:disabled{opacity:.55;cursor:default}.feedback{margin-top:12px;border-radius:8px;padding:12px;line-height:1.45}.feedback.ok{background:#e9f6f1;color:#0b5b43}.feedback.err{background:#fff0f0;color:#8a2020}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}.score{text-align:center}.score-big{font-size:44px;font-weight:700;color:#147a5c;margin:8px 0}
  </style>
</head>
<body>
<main class="wrap"><div id="app"></div></main>
<script>
const QUESTIONS = [
  {question: "During attack of angina the best drug taken is:", options: ["Oral nitrates", "Sublingual nitrates", "Oral propranolol", "Oral aspirin"], answer: 1},
  {question: "Which of the following is antihypertensive drug that inhibit ACE:", options: ["Propranolol", "Nefidipine", "Captopril", "Losartan"], answer: 2},
  {question: "Which of the following drugs increase myocardial contractility and used in heart failure:", options: ["Digoxin", "Frusemide", "Propranolol", "Captopril"], answer: 0},
  {question: "Which of the following used to treat bronchial asthma by blocking M3 receptors:", options: ["Theophylline", "Salmeterol", "Ipratropium", "Ketotifen"], answer: 2},
  {question: "The best analgesic in patient with myocardial infarction:", options: ["Aspirin", "Ibuprofen", "Morphine", "Paracetamol"], answer: 2},
  {question: "Propranolol used in:", options: ["Hypertension", "Heart failure", "Pulmonary edema", "All of the above"], answer: 0},
  {question: "The 1st line in treating diarrhea is:", options: ["Antibiotics", "Fluid replacement", "Cortisone", "Aspirin"], answer: 1},
  {question: "Which of the following is antihypertensive drug that block alpha receptors:", options: ["Captopril", "Nefidipine", "Prazosin", "Verapamil"], answer: 2},
  {question: "Which of the following is ca channel blocker:", options: ["Verapamil", "Propranolol", "Prazosin", "Ramipril"], answer: 0},
  {question: "Pharmacokinetics does not include:", options: ["Absorption", "Mechanism of drug action", "Distribution", "Metabolism"], answer: 1},
  {question: "Which of the following is parasympatholytic drug:", options: ["Morphine", "Adrenaline", "Atropine", "Prazosin"], answer: 2},
  {question: "The mechanism by which propranolol act:", options: ["Block beta receptors", "Block alpha receptors", "Inhibit DNA", "Inhibit folic acid synthesis"], answer: 0},
  {question: "Vasodilators used in:", options: ["Hypertension", "Edema", "All of the above", "Non of the above"], answer: 0},
  {question: "The best route of aminophylline in acute severe asthma:", options: ["Inhalation", "Rectal", "Intravenous infusion", "Oral"], answer: 2},
  {question: "The most serious complication of adrenaline:", options: ["Hypersensitivity", "Hypertension", "Arrhythmias", "Lipodystrophy"], answer: 2},
  {question: "The best type of contraception in lactation:", options: ["Combined pills", "Estrogen containing pills", "Progesterone containing pills", "Non of the above"], answer: 2},
  {question: "Which of the following is disadvantage of rectal route:", options: ["Rapid onset", "No 1st pass metabolism", "Irregular absorption", "Suitable for comatose"], answer: 2},
  {question: "Drugs with Vd 30 L:", options: ["Present in plasma only", "Dialysis is useless", "Tight bound to plasma proteins", "Don’t need monitoring"], answer: 1},
  {question: "The best treatment of hypertension in pregnancy is:", options: ["Thiazides", "ACEIs", "ARBs", "Alpha methyl dopa"], answer: 3},
  {question: "Nitrates act by:", options: ["Block beta receptors", "Increase sodium excretion", "Increase NO synthesis", "Stimulate alpha receptors"], answer: 2},
  {question: "Side effects of atropine doesn’t include:", options: ["Dry mouth", "Urine retention", "Increased heart rate", "Diarrhea"], answer: 3},
  {question: "Which sympatholytic used in prostatic enlargement:", options: ["Propranolol", "Prazosin", "Adrenaline", "Glargine"], answer: 1},
  {question: "Which of the following isn’t use of corticosteroids:", options: ["Osteoporosis", "Prevent organ rejection", "Maturation of fetal lung", "Addison disease"], answer: 0},
  {question: "The effect of sympathomimetics on bronchial system include:", options: ["Bronchospasm", "Increase airway secretions", "Bronchodilatation", "Non of the above"], answer: 2},
  {question: "Propranolol used in the following diseases except:", options: ["Hypertension", "Tachycardia", "Bronchial asthma", "Thyrotoxicosis"], answer: 2},
  {question: "Contraindication of adrenaline include:", options: ["Cardiac arrest", "Acute severe asthma", "Local anaesthetics", "Thyrotoxicosis"], answer: 3},
  {question: "Which of the following suitable in coma:", options: ["Oral", "Intravenous", "Subcutaneous", "Inhalation"], answer: 1}
];
let current=0,answers={},bank=[];const app=document.getElementById('app');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function home(){current=0;answers={};app.innerHTML=`<section class="card home"><h1>Nursing Quiz Bank</h1><button class="btn primary" onclick="start()">Start Quiz</button></section>`}
function start(){bank=shuffle(QUESTIONS);render()}
function render(){const q=bank[current];app.innerHTML=`<section class="card"><div class="row"><div class="title">Question ${current+1} / ${bank.length}</div></div><div class="q">${q.question}</div><div class="opts">${q.options.map((o,i)=>`<div class="opt" onclick="check(${i},this)">${o}</div>`).join('')}</div></section>`}
function check(idx, el){const q=bank[current];if(idx===q.answer){el.classList.add('correct');}else{el.classList.add('wrong');el.parentElement.children[q.answer].classList.add('correct');}Array.from(el.parentElement.children).forEach(c=>c.style.pointerEvents='none');setTimeout(()=>{current++;current<bank.length?render():finish()},1000)}
function finish(){app.innerHTML=`<section class="card score"><h1>Finished!</h1><button class="btn primary" onclick="home()">Back to Start</button></section>`}
home();
</script>
</body>
</html>
